<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Generate QR codes from text and decode QR code images entirely in your browser."
    />
    <title>QR Code Generator and Decoder</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="vendor/qrcode-generator/qrcode.js"></script>
    <script defer src="vendor/jsqr/jsQR.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="tool-grid" aria-label="QR code tools">
        <article class="card generator" aria-labelledby="generator-title">
          <div class="card-header">
            <p class="step">Generate</p>
            <h2 id="generator-title">Text to QR code</h2>
          </div>

          <label for="qr-text">Text or URL</label>
          <textarea
            id="qr-text"
            rows="8"
            spellcheck="false"
            placeholder="Start typing to generate a QR code..."
          >https://hashpup1.github.io/qr/</textarea>

          <div class="qr-output" aria-live="polite">
            <canvas id="qr-canvas" width="320" height="320" aria-label="Generated QR code"></canvas>
            <p id="generate-status" class="status">Ready.</p>
            <a id="download-link" class="button" download="qr-code.png" href="#">Download PNG</a>
          </div>
        </article>

        <article class="card decoder" aria-labelledby="decoder-title">
          <div class="card-header">
            <p class="step">Decode</p>
            <h2 id="decoder-title">QR image to text</h2>
          </div>

          <button id="drop-zone" class="drop-zone" type="button" aria-describedby="upload-help decode-status">
            <span class="upload-icon" aria-hidden="true">⌁</span>
            <strong>Drop a QR image here</strong>
            <span id="upload-help">or click to select a PNG, JPG, GIF, or WebP file</span>
          </button>
          <input id="file-input" type="file" accept="image/*" hidden />

          <div class="decode-preview" aria-live="polite">
            <canvas id="preview-canvas" width="320" height="240" aria-label="Selected QR code preview" hidden></canvas>
            <p id="decode-status" class="status">No image selected.</p>
          </div>

          <label for="decoded-text">Decoded text</label>
          <textarea id="decoded-text" rows="8" readonly placeholder="Decoded QR text appears here..."></textarea>
          <button id="copy-button" class="button secondary" type="button" disabled>Copy decoded text</button>
        </article>
      </section>
    </main>
  </body>
</html>
